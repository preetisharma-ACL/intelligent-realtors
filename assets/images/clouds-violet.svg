<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="700" viewBox="0 0 2000 700" preserveAspectRatio="none">
  <!-- Second, slower cloud layer in a dusk violet, matching the purple sky tones. -->
  <filter id="c" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0024 0.008" numOctaves="4" seed="29" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.78   0 0 0 0 0.62   0 0 0 0 0.92   0 0 0 1.5 -0.72"/>
  </filter>
  <rect width="2000" height="700" filter="url(#c)"/>
</svg>
